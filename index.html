<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Test</title>
</head>
<body>
    <h2>Text-to-Speech Test</h2>

    <textarea id="text" rows="5" cols="40" placeholder="Masukkan teks..."></textarea><br><br>
    <button onclick="generateTTS()">Generate</button>

    <h3>Output:</h3>
    <audio id="audio" controls></audio>

<script>
async function generateTTS() {
    let text = document.getElementById("text").value;
    if (!text) {
        alert("Masukkan teks dulu");
        return;
    }

    const audio = document.getElementById("audio");

    try {
        let response = await fetch("https://applied-lazily-constitutional.trycloudflare.com/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text })
        });

        if (!response.ok) {
            throw new Error("Server error");
        }

        let blob = await response.blob();
        let url = URL.createObjectURL(blob);

        audio.src = url;
        audio.play();

    } catch (e) {
        alert("Gagal menghasilkan suara: " + e);
    }
}
</script>

</body>
</html>
